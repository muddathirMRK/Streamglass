name: Build StreamGlass unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26 installation found"
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS' || true

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project StreamGlass.xcodeproj \
            -scheme StreamGlass \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload StreamGlass-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamGlass.app Payload/
          zip -qry StreamGlass-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamGlass-unsigned-ipa
          path: StreamGlass-unsigned.ipa
