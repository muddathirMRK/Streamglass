name: Build StreamGlass unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project StreamGlass.xcodeproj \
            -scheme StreamGlass \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload StreamGlass-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamGlass.app Payload/
          zip -qry StreamGlass-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamGlass-unsigned-ipa
          path: StreamGlass-unsigned.ipa
